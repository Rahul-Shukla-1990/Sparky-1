[tool.poetry]
name = "sparky-maritime-platform"
version = "0.1.0"
description = "Prototype backend services for a maritime intelligence platform"
authors = ["Sparky AI <noreply@example.com>"]
packages = [{ include = "app", from = "backend" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
motor = "^3.3.1"
httpx = "^0.27.0"
pydantic = "^2.6.1"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
pythonpath = ["backend"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
